<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANT // MASTER ADMIN</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="admin.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="logo.png" alt="VANT MASTER" style="height: 29px;">
            </div>

            <nav class="admin-nav">
                <button class="nav-item active" data-tab="missions">
                    <i class="fas fa-satellite-dish"></i> <span data-i18n="nav_operations">OPERATIONS</span>
                </button>
                <button class="nav-item" data-tab="clients">
                    <i class="fas fa-building"></i> <span data-i18n="nav_clients">CLIENTS</span>
                </button>
                <button class="nav-item" data-tab="settings">
                    <i class="fas fa-cog"></i> <span data-i18n="nav_system">SYSTEM</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="admin-user">
                    <div class="avatar"><i class="fas fa-user-shield"></i></div>
                    <div class="user-info">
                        <h4 data-i18n="user_role">SUPER ADMIN</h4>
                        <span data-i18n="status_online">ONLINE</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <!-- Missions View -->
            <div id="view-missions" class="view cancel-animation active">
                <header class="content-header">
                    <div class="header-title">
                        <h1 data-i18n="header_active_ops">ACTIVE OPERATIONS</h1>
                        <span data-i18n="header_ops_subtitle">REAL-TIME OPERATIONAL STATUS</span>
                    </div>
                    <button class="primary-btn" id="create-mission-btn">
                        <i class="fas fa-plus"></i> <span data-i18n="btn_new_op">NEW OPERATION</span>
                    </button>
                </header>

                <div class="missions-grid" id="missions-grid">
                    <!-- Missions injected here -->
                </div>
            </div>


        </main>
    </div>

    <!-- Create Mission Modal -->
    <div id="create-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="modal_new_op_title">INITIATE NEW OPERATION</h2>
                <button class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <form id="create-mission-form">
                <div class="form-group">
                    <label data-i18n="label_client_org">CLIENT ORGANIZATION</label>
                    <input type="text" id="client-name" placeholder="E.g. SECTOR 7 SECURITY" required>
                </div>
                <div class="form-group">
                    <label data-i18n="label_op_name">OPERATION NAME</label>
                    <input type="text" id="mission-name" placeholder="E.g. PROJECT NIGHTFALL" required>
                </div>
                <div class="form-group">
                    <label data-i18n="label_op_channels">OPERATION CHANNELS</label>
                    <input type="text" id="mission-channels" placeholder="E.g. LOGISTICS, ALPHA, BRAVO">
                    <small style="color: var(--text-dim); font-size: 10px; margin-top: 4px; display: block;"
                        data-i18n="hint_channels">Comma separated. Main link created by default.</small>
                </div>
                <div class="form-group">
                    <label data-i18n="label_access_code">ACCESS CODE</label>
                    <div class="input-row">
                        <input type="text" id="mission-code" placeholder="AUTO-GENERATED" readonly>
                        <button type="button" id="generate-code-btn"><i class="fas fa-random"></i></button>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn" data-i18n="btn_create_op">CREATE OPERATION</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Login Overlay -->
    <div id="login-overlay" class="overlay active">
        <div class="login-box">
            <img src="logo.png" alt="VANT">
            <h2 data-i18n="login_title">MASTER ACCESS</h2>
            <input type="password" id="admin-password" placeholder="ENTER KEY">
            <button id="master-login-btn" data-i18n="btn_authenticate">AUTHENTICATE</button>
        </div>
    </div>

    <!-- System Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="header_settings">SYSTEM SETTINGS</h2>
                <button class="close-modal-settings"><i class="fas fa-times"></i></button>
            </div>
            <div class="settings-container">
                <div class="setting-card">
                    <div class="setting-header">
                        <h3 data-i18n="setting_lang_title">INTERFACE LANGUAGE</h3>
                        <p data-i18n="setting_lang_desc">Select the display language for the admin console.</p>
                    </div>
                    <div class="language-switcher">
                        <button class="lang-btn active" data-lang="en">ENGLISH</button>
                        <button class="lang-btn" data-lang="es">ESPAÑOL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="admin.js"></script>
</body>

</html>
