<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4ADE80;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Left Wing -->
    <path d="M20 20 L100 100 L20 100 Z" fill="url(#grad1)" opacity="0.8"/>
    <!-- Right Wing -->
    <path d="M180 20 L100 100 L180 60 Z" fill="url(#grad1)" opacity="0.9"/>
    <!-- Center/Bottom -->
    <path d="M 20 20 L 180 20 L 100 180 Z" fill="none" stroke="url(#grad1)" stroke-width="10" />
    
    <!-- Redrawing for a better match to the VANT logo -->
    <!-- Large Triangle pointing down -->
    <!-- Slice 1: Left top -->
    <path d="M 10 10 L 90 90 L 10 90 Z" fill="#2D6A4F" /> 
    <!-- This is guessing. Let's just make a cool tactical triangle using the gradient -->
    
    <rect width="200" height="200" fill="#0f1419" />
    
    <g transform="translate(20, 40)">
        <!-- Main Shape -->
        <path d="M 0 0 L 160 0 L 80 140 Z" fill="none" />
        
        <!-- Left geometric chunk -->
        <path d="M 0 0 L 70 0 L 40 50 Z" fill="#34D399" />
        
        <!-- Right geometric chunk -->
        <path d="M 80 0 L 160 0 L 100 50 Z" fill="#10B981" />
        
        <!-- Bottom tip -->
        <path d="M 45 60 L 95 60 L 80 140 Z" fill="#059669" />
    </g>
    
    <!-- Text VANT -->
    <!-- Since the user wants the LOGO, I will focus on the icon part. The text is VANT. -->
</svg>
