<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANT // COMMAND CENTER</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Leaflet Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="logo.png" alt="VANT LOGO" style="height: 29px;">
                </div>
                <div class="connection-status">
                    <div class="status-dot"></div>
                    <span id="status-text" data-i18n="status_disconnected">DISCONNECTED</span>
                </div>
            </div>

            <div class="mission-info">
                <h3 data-i18n="header_active_op">ACTIVE OPERATION</h3>
                <h2 id="mission-name">--</h2>
                <div class="mission-code" id="mission-code">--</div>
            </div>

            <!-- Audio Visualizer Space -->
            <div class="visualizer-container">
                <canvas id="audio-visualizer"></canvas>
            </div>



            <div class="ptt-control">
                <button id="dashboard-ptt-btn" class="dashboard-ptt-btn">
                    <i class="fas fa-microphone"></i>
                </button>
                <div class="connection-status" style="width: 100%; justify-content: center;">
                    <div class="status-dot" id="ptt-dot"></div>
                    <span id="ptt-status-text" data-i18n="status_standby">STANDBY</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="action-btn" id="generate-link-btn">
                    <i class="fas fa-link"></i> <span data-i18n="btn_copy_link">COPY ACCESS LINK</span>
                </button>
            </div>
        </aside>

        <!-- Units Sidebar -->
        <aside class="units-sidebar" id="units-sidebar">
            <button class="sidebar-toggle" id="units-toggle" title="Toggle Sidebar">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="unit-list-section">
                <div class="section-header">
                    <h3 data-i18n="header_field_units">FIELD UNITS</h3>
                    <span class="badge" id="unit-count">0</span>
                </div>
                <div class="unit-list" id="unit-list">
                    <!-- Units will be injected here -->
                </div>
            </div>
        </aside>

        <!-- Main Map Area -->
        <main class="map-container">
            <div id="tactical-map"></div>

            <!-- Map Overlay UI -->
            <div class="map-overlay top-right">
                <div class="overlay-panel">
                    <div class="data-row">
                        <span class="label" data-i18n="label_lat">LAT</span>
                        <span class="value" id="cursor-lat">--.--</span>
                    </div>
                    <div class="data-row">
                        <span class="label" data-i18n="label_lng">LNG</span>
                        <span class="value" id="cursor-lng">--.--</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal active">
        <div class="modal-content">
            <h2 data-i18n="modal_auth_title">ADMIN AUTH</h2>
            <p data-i18n="modal_auth_desc">Enter Operation Code to Monitor</p>
            <input type="text" id="admin-code-input" placeholder="CODE" maxlength="8">
            <button id="admin-login-btn" data-i18n="btn_access">ACCESS SYSTEM</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
